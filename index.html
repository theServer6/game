<!DOCTYPE html>
<html>
<head>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
  }

  /* Full-screen iframe */
  iframe {
    display: block;
    width: 100vw;
    height: 100dvh;
    border: none;
  }

  /* Container for the floating buttons in the top-right corner */
  #button-container {
    position: fixed;
    top: 10px;
    right: 10px;
    z-index: 9999;
    display: flex;
    gap: 8px;
  }

  /* Shared styling for both buttons */
  .nav-button {
    background: rgba(0, 0, 0, 0.25);
    color: white;
    border: none;
    border-radius: 6px;
    padding: 6px 12px;
    font-size: 18px;
    font-family: serif;
    cursor: pointer;
  }

  .nav-button:hover {
    background: rgba(0, 0, 0, 0.6);
  }
</style>
</head>
<body>

  <!-- Floating buttons container -->
  <div id="button-container">
    <button class="nav-button" onclick="loadSite('science')" title="Totally Science">&pi;</button>
    <button class="nav-button" onclick="loadSite('custom')" title="Custom Site">&sect;</button>
  </div>

  <!-- Main full-screen iframe starting on Mathletics -->
  <iframe id="main-frame" src="https://mathletics.com" title="Mathletics"></iframe>

  <script>
    const urls = {
      home: "https://mathletics.com",
      science: "https://d11jzht7mj96rr.cloudfront.net/",
      custom: "" // <-- Paste your second URL inside these quotes later
    };

    let currentView = "home";

    function loadSite(target) {
      const frame = document.getElementById("main-frame");

      // If you click the button for the site you are already on, go back to Mathletics
      if (currentView === target) {
        frame.src = urls.home;
        currentView = "home";
        return;
      }

      // Check if the URL is empty before switching
      if (!urls[target]) {
        alert("No URL set for this button yet!");
        return;
      }

      frame.src = urls[target];
      currentView = target;
    }
  </script>

</body>
</html>
