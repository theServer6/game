<!DOCTYPE html>
<html>
<head>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
  }

  /* Full-screen iframe */
  iframe {
    display: block;
    width: 100vw;
    height: 100dvh;
    border: none;
  }

  /* Subtle Pi button in the top-right corner */
  #pi-button {
    position: fixed;
    top: 10px;
    right: 10px;
    z-index: 9999;
    background: rgba(0, 0, 0, 0.25);
    color: white;
    border: none;
    border-radius: 6px;
    padding: 6px 12px;
    font-size: 18px;
    font-family: serif;
    cursor: pointer;
  }

  #pi-button:hover {
    background: rgba(0, 0, 0, 0.6);
  }
</style>
</head>
<body>

  <!-- Floating Pi button -->
  <button id="pi-button" onclick="toggleSite()" title="Switch view">&pi;</button>

  <!-- Main full-screen iframe starting on Mathletics -->
  <iframe id="main-frame" src="https://mathletics.com" title="Mathletics"></iframe>

  <script>
    let showingGames = false;

    function toggleSite() {
      const frame = document.getElementById("main-frame");

      if (!showingGames) {
        // Replace with your preferred games URL
        frame.src = "https://d11jzht7mj96rr.cloudfront.net/";
        showingGames = true;
      } else {
        // Switch back to Mathletics
        frame.src = "https://mathletics.com";
        showingGames = false;
      }
    }
  </script>

</body>
</html>
